
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concrete Project Feedback Form</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:radial-gradient(circle at top,#1b1b1b,#0f0f0f);
    margin:0;
    padding:20px;
    color:#eaeaea;
}

.container{
    max-width:800px;
    margin:auto;
    background:#1c1c1c;
    padding:35px;
    border-radius:14px;
    border:1px solid #2f2f2f;
    box-shadow:0 0 25px rgba(0,0,0,.6);
    position:relative;
    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,#ff8c00,#ff3c3c,#ff8c00);
}

h1{
    text-align:center;
    color:#fff;
    margin-bottom:10px;
    font-size:28px;
    letter-spacing:1px;
}

.subtitle{
    text-align:center;
    color:#b8b8b8;
    margin-bottom:30px;
}

.section{
    margin-bottom:22px;
    padding:15px;
    border-radius:10px;
    background:#222;
    border:1px solid #2d2d2d;
    transition:.2s;
}

.section:hover{
    border-color:#ff8c00;
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(0,0,0,.4);
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#f5f5f5;
}

input[type="text"],
input[type="email"],
textarea,
select{
    width:100%;
    padding:12px;
    background:#151515;
    border:1px solid #333;
    border-radius:8px;
    color:#fff;
    font-size:14px;
    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#ff8c00;
    box-shadow:0 0 10px rgba(255,140,0,.25);
    outline:none;
}

.radio-group,
.rating-group{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:10px;
}

.rating-group label,
.radio-group label{
    font-weight:normal;
    color:#d8d8d8;
    padding:6px 10px;
    border-radius:6px;
    background:#1a1a1a;
    border:1px solid #2a2a2a;
}

input[type="radio"]{
    accent-color:#ff8c00;
}

button{
    width:100%;
    background:linear-gradient(90deg,#ff8c00,#ff5a00);
    color:white;
    border:none;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    border-radius:10px;
    cursor:pointer;
}

.required{
    color:#ff5a5a;
}

::placeholder{
    color:#888;
}
</style>
</head>
<body>

<div class="container">

<h1>Project Feedback Form</h1>

<p class="subtitle">
Thank you for choosing us. Your feedback helps us continue improving our services.
</p>

<form action="https://formsubmit.co/info@fuerzaatx.com" method="POST">

<input type="hidden" name="_subject" value="New Concrete Feedback Submission">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_next" value="https://fuerzaatx.com">

<div class="section">
<label>Name <span class="required">*</span></label>
<input type="text" name="Customer Name" placeholder="Your Name" required>
</div>

<div class="section">
<label>Email <span class="required">*</span></label>
<input type="email" name="Customer Email" placeholder="Your Email" required>
</div>

<div class="section">
<label>Type of Concrete Work Completed</label>
<select name="Project Type" required>
<option value="" disabled selected>Select Project Type</option>
<option value="Foundation">Foundation</option>
<option value="Driveway">Driveway</option>
<option value="Patio">Patio</option>
<option value="Sidewalk">Sidewalk</option>
<option value="Flatwork">Flatwork</option>
<option value="Drainage">Drainage</option>
<option value="Other">Other</option>
</select>
</div>

<div class="section">
<label>Overall Satisfaction <span class="required">*</span></label>
<div class="rating-group">
<label><input type="radio" name="Overall Satisfaction" value="1" required>1</label>
<label><input type="radio" name="Overall Satisfaction" value="2">2</label>
<label><input type="radio" name="Overall Satisfaction" value="3">3</label>
<label><input type="radio" name="Overall Satisfaction" value="4">4</label>
<label><input type="radio" name="Overall Satisfaction" value="5">5</label>
</div>
</div>

<div class="section">
<label>Was the project completed on time?</label>
<div class="radio-group">
<label><input type="radio" name="Completed On Time" value="Yes">Yes</label>
<label><input type="radio" name="Completed On Time" value="No">No</label>
</div>
</div>

<div class="section">
<label>Was the work area left clean after completion?</label>
<div class="radio-group">
<label><input type="radio" name="Area Left Clean" value="Yes">Yes</label>
<label><input type="radio" name="Area Left Clean" value="No">No</label>
</div>
</div>

<div class="section">
<label>Was communication throughout the project satisfactory?</label>
<div class="radio-group">
<label><input type="radio" name="Communication Satisfactory" value="Yes">Yes</label>
<label><input type="radio" name="Communication Satisfactory" value="No">No</label>
</div>
</div>

<div class="section">
<label>Quality of Work</label>
<div class="rating-group">
<label><input type="radio" name="Quality of Work" value="1">1</label>
<label><input type="radio" name="Quality of Work" value="2">2</label>
<label><input type="radio" name="Quality of Work" value="3">3</label>
<label><input type="radio" name="Quality of Work" value="4">4</label>
<label><input type="radio" name="Quality of Work" value="5">5</label>
</div>
</div>

<div class="section">
<label>Would you recommend us to friends or family?</label>
<div class="radio-group">
<label><input type="radio" name="Recommend Us" value="Yes">Yes</label>
<label><input type="radio" name="Recommend Us" value="No">No</label>
</div>
</div>

<div class="section">
<label>What did we do well?</label>
<textarea name="What We Did Well" placeholder="Share your experience..."></textarea>
</div>

<div class="section">
<label>How can we improve?</label>
<textarea name="Suggestions For Improvement" placeholder="Your suggestions..."></textarea>
</div>

<div class="section">
<label>Additional Comments</label>
<textarea name="Additional Comments" placeholder="Anything else you'd like us to know?"></textarea>
</div>

<button type="submit">Submit Feedback</button>

</form>

</div>

</body>
</html>
